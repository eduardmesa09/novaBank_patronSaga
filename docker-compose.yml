# NovaBank International · Patrón Saga
#
# Database-per-Service llevado hasta el final: cada microservicio tiene su
# PROPIO SERVIDOR de Postgres, con su propio contenedor, su propio volumen y
# sus propias credenciales. No hay una instancia compartida, así que un
# servicio no puede alcanzar los datos de otro ni equivocándose: no existe
# ruta de red ni credencial que se lo permita.
#
#   db-accounts  ·  accounts_db  ·  volumen accounts_data  ·  puerto 5433
#   db-risk      ·  risk_db      ·  volumen risk_data      ·  puerto 5434
#   db-clearing  ·  clearing_db  ·  volumen clearing_data  ·  puerto 5435
#   db-saga      ·  saga_db      ·  volumen saga_data      ·  puerto 5436
#
# Los puertos publicados son solo para inspeccionar con un cliente SQL; los
# servicios se hablan por la red interna de Compose.

services:
  # --------------------------------------------------------------------------
  # Bases de datos: una por dominio, aisladas entre sí
  # --------------------------------------------------------------------------
  db-accounts:
    image: postgres:16-alpine
    container_name: nova-db-accounts
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: accounts_user
      POSTGRES_PASSWORD: accounts_pwd
    ports:
      - "5433:5432"
    volumes:
      - accounts_data:/var/lib/postgresql/data
      - ./db/accounts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts_user -d accounts_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-risk:
    image: postgres:16-alpine
    container_name: nova-db-risk
    environment:
      POSTGRES_DB: risk_db
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: risk_pwd
    ports:
      - "5434:5432"
    volumes:
      - risk_data:/var/lib/postgresql/data
      - ./db/risk:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_user -d risk_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-clearing:
    image: postgres:16-alpine
    container_name: nova-db-clearing
    environment:
      POSTGRES_DB: clearing_db
      POSTGRES_USER: clearing_user
      POSTGRES_PASSWORD: clearing_pwd
    ports:
      - "5435:5432"
    volumes:
      - clearing_data:/var/lib/postgresql/data
      - ./db/clearing:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearing_user -d clearing_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-saga:
    image: postgres:16-alpine
    container_name: nova-db-saga
    environment:
      POSTGRES_DB: saga_db
      POSTGRES_USER: saga_user
      POSTGRES_PASSWORD: saga_pwd
    ports:
      - "5436:5432"
    volumes:
      - saga_data:/var/lib/postgresql/data
      - ./db/saga:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga_user -d saga_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # Infraestructura compartida: bus de eventos y motor de flujos
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: nova-prefect
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --------------------------------------------------------------------------
  # Microservicios de dominio: cada uno con UNA sola base, la suya
  # --------------------------------------------------------------------------
  accounts:
    build: ./services/accounts
    container_name: nova-accounts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      SERVICE_NAME: accounts
      DATABASE_URL: postgresql+psycopg://accounts_user:accounts_pwd@db-accounts:5432/accounts_db
      REDIS_URL: redis://redis:6379/0
      STEP_DELAY_MIN: "2"
      STEP_DELAY_MAX: "4"
    ports:
      - "8001:8001"
    depends_on:
      db-accounts:
        condition: service_healthy
      redis:
        condition: service_healthy

  risk:
    build: ./services/risk
    container_name: nova-risk
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    environment:
      SERVICE_NAME: risk
      DATABASE_URL: postgresql+psycopg://risk_user:risk_pwd@db-risk:5432/risk_db
      REDIS_URL: redis://redis:6379/0
      STEP_DELAY_MIN: "2"
      STEP_DELAY_MAX: "4"
    ports:
      - "8002:8002"
    depends_on:
      db-risk:
        condition: service_healthy
      redis:
        condition: service_healthy

  clearing:
    build: ./services/clearing
    container_name: nova-clearing
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    environment:
      SERVICE_NAME: clearing
      DATABASE_URL: postgresql+psycopg://clearing_user:clearing_pwd@db-clearing:5432/clearing_db
      REDIS_URL: redis://redis:6379/0
      STEP_DELAY_MIN: "2"
      STEP_DELAY_MAX: "4"
    ports:
      - "8003:8003"
    depends_on:
      db-clearing:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Capa de entrada: orquestador y bitácora
  # --------------------------------------------------------------------------
  gateway:
    build: ./gateway
    container_name: nova-gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      SERVICE_NAME: gateway
      DATABASE_URL: postgresql+psycopg://saga_user:saga_pwd@db-saga:5432/saga_db
      REDIS_URL: redis://redis:6379/0
      ACCOUNTS_URL: http://accounts:8001
      RISK_URL: http://risk:8002
      CLEARING_URL: http://clearing:8003
      PREFECT_API_URL: http://prefect:4200/api
      STEP_DELAY_MIN: "2"
      STEP_DELAY_MAX: "4"
    ports:
      - "8000:8000"
    depends_on:
      db-saga:
        condition: service_healthy
      redis:
        condition: service_healthy
      accounts:
        condition: service_started
      risk:
        condition: service_started
      clearing:
        condition: service_started

volumes:
  accounts_data:
  risk_data:
  clearing_data:
  saga_data:
